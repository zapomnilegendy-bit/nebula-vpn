server:
  name: nebula-api-dev
  host: 0.0.0.0
  port: 8080
  grpc_port: 9090
  shutdown_timeout: 30s
  read_timeout: 15s
  write_timeout: 15s

database:
  host: localhost
  port: 5432
  name: nebula_vpn
  user: nebula
  password: nebula_secret
  ssl_mode: disable
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 5m

redis:
  host: localhost
  port: 6379
  password: nebula_redis
  db: 0
  pool_size: 10
  min_idle_conns: 5

auth:
  jwt_access_secret: dev-access-secret-key-32chars!
  jwt_refresh_secret: dev-refresh-secret-key-32chars!
  access_token_ttl: 15m
  refresh_token_ttl: 168h
  jwt_issuer: nebula-vpn-dev
  argon2_time: 3
  argon2_memory: 65536
  argon2_threads: 4
  argon2_key_length: 32

rate_limiter:
  enabled: true
  requests_per_second: 1000
  burst: 2000
  ban_duration: 1m
  max_login_attempts: 10
  login_ban_duration: 1m

transport:
  wireguard:
    port_range: "51820-51830"
    interface: wg0
    mtu: 1420
    persistent_keepalive: 25
  vless_reality:
    port: 443
    server_names:
      - "www.microsoft.com"
      - "www.apple.com"
      - "www.cloudflare.com"
  hysteria2:
    port: 8443
    up_mbps: 100
    down_mbps: 100
    obfs_password: dev-obfs-password
  tuic:
    port: 1443

adaptive_transport:
  enabled: true
  check_interval: 30s
  min_stable_duration: 120s
  fallback_cooldown: 60s

logging:
  level: debug
  format: console
  outputs:
    - stdout

billing:
  stripe:
    secret_key: ""
    webhook_secret: ""
  apple:
    shared_secret: ""
  google:
    service_account: ""
    package_name: com.nebula.vpn
