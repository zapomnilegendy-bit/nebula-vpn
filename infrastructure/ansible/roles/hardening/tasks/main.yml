---
- name: Set hostname
  hostname:
    name: "nebula-{{ node_role }}-{{ ansible_hostname }}"

- name: Configure sysctl for networking
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: yes
    state: present
    reload: yes
  loop:
    - { key: net.ipv4.ip_forward, value: "1" }
    - { key: net.ipv6.conf.all.forwarding, value: "1" }
    - { key: net.ipv4.conf.all.send_redirects, value: "0" }
    - { key: net.ipv4.tcp_congestion_control, value: bbr }
    - { key: net.core.default_qdisc, value: fq }
    - { key: net.ipv4.tcp_notsent_lowat, value: "16384" }

- name: Install UFW
  apt:
    name: ufw
    state: present

- name: Configure UFW defaults
  ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Allow SSH
  ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow WireGuard
  ufw:
    rule: allow
    port: "{{ wireguard_port }}"
    proto: udp

- name: Enable UFW
  ufw:
    state: enabled

- name: Install fail2ban
  apt:
    name: fail2ban
    state: present

- name: Configure fail2ban for SSH
  template:
    src: fail2ban-ssh.conf.j2
    dest: /etc/fail2ban/jail.d/ssh.conf
    mode: 0644
  notify: restart fail2ban

- name: Start fail2ban
  systemd:
    name: fail2ban
    state: started
    enabled: yes

- name: Disable root SSH login
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^PermitRootLogin"
    line: "PermitRootLogin no"
  notify: restart ssh

- name: Disable password authentication
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^PasswordAuthentication"
    line: "PasswordAuthentication no"
  notify: restart ssh

- name: Install monitoring tools
  apt:
    name:
      - htop
      - iotop
      - netdata
      - prometheus-node-exporter
    state: present

- name: Configure netdata streaming
  template:
    src: netdata-stream.conf.j2
    dest: /etc/netdata/stream.conf
    mode: 0644
  notify: restart netdata

  handlers:
    - name: restart fail2ban
      systemd:
        name: fail2ban
        state: restarted

    - name: restart ssh
      systemd:
        name: sshd
        state: restarted

    - name: restart netdata
      systemd:
        name: netdata
        state: restarted
