replicaCount: 2

image:
  repository: ghcr.io/nebula-vpn/backend/api-gateway
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.nebula-vpn.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: api-tls
      hosts:
        - api.nebula-vpn.io

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

env:
  NEBULA_ENV: production
  NEBULA_DB_HOST: nebula-postgresql.default.svc.cluster.local
  NEBULA_DB_PORT: "5432"
  NEBULA_DB_NAME: nebula
  NEBULA_DB_USER: nebula
  NEBULA_REDIS_ADDR: nebula-redis-master.default.svc.cluster.local:6379

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
