[package]
name = "nebula-core"
version = "0.1.0"
edition = "2021"
description = "Cross-platform VPN core library for NebulaVPN clients"

[lib]
name = "nebula_core"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
x25519-dalek = "2"
blake3 = "1"
zeroize = { version = "1", features = ["derive"] }
tracing = "0.1"
base64 = "0.22"
hex = "0.4"
rand = "0.10"
ring = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2"

[target.'cfg(target_os = "ios")'.dependencies]
security-framework = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
