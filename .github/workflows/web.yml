name: Web Panels CI

on:
  push:
    branches: [main, develop]
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    branches: [main]
    paths: ['web/**']

env:
  REGISTRY: ghcr.io

jobs:
  user-panel:
    name: User Panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/user-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/user-panel/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint || true
      - name: Build
        run: npm run build
      - name: Login
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: web/user-panel
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/user-panel:latest,${{ env.REGISTRY }}/${{ github.repository }}/user-panel:${{ github.sha }}

  admin-panel:
    name: Admin Panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/admin-panel/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint || true
      - name: Build
        run: npm run build
      - name: Login
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: web/admin-panel
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/admin-panel:latest,${{ env.REGISTRY }}/${{ github.repository }}/admin-panel:${{ github.sha }}
